name: auto710

services:
  # ===================== MySQL 8 =====================
  mysql8:
    image: mysql:8.0
    container_name: auto710-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root@auto710}
      MYSQL_DATABASE: auto_repair
      MYSQL_USER: ${MYSQL_USER:-auto_repair_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auto710@2026}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root@auto710}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===================== Redis 7 =====================
  redis7:
    image: redis:7-alpine
    container_name: auto710-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-auto710@2026}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ===================== RabbitMQ 3.13 =====================
  rabbitmq3:
    image: rabbitmq:3.13-management
    container_name: auto710-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-auto710}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-auto710@2026}
      RABBITMQ_DEFAULT_VHOST: auto_repair
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # ===================== MinIO =====================
  minio:
    image: minio/minio:latest
    container_name: auto710-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-auto710}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-auto710@2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ===================== 后端 API =====================
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auto710-backend
    restart: always
    depends_on:
      mysql8:
        condition: service_healthy
      redis7:
        condition: service_started
      rabbitmq3:
        condition: service_started
      minio:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql8:3306/auto_repair?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-auto_repair_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-auto710@2026}
      SPRING_DATA_REDIS_HOST: redis7
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-auto710@2026}
      SPRING_RABBITMQ_HOST: rabbitmq3
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-auto710}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-auto710@2026}
      AUTO710_JWT_SECRET: ${JWT_SECRET:-710auto-secret-key-please-change-in-production-0123456789}
      AUTO710_SECURITY_AES_KEY: ${AES_KEY:-710autoAesKey1234567890abcdef}
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs

  # ===================== 后台管理 =====================
  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: auto710-admin
    restart: always
    depends_on:
      - backend-api
    ports:
      - "8081:80"

  # ===================== PC 官网 =====================
  web-www:
    build:
      context: ./web-www
      dockerfile: Dockerfile
    container_name: auto710-www
    restart: always
    depends_on:
      - backend-api
    ports:
      - "8082:80"

  # ===================== H5 移动端（客户 + 技师端） =====================
  web-h5:
    build:
      context: ./h5
      dockerfile: Dockerfile
    container_name: auto710-h5
    restart: always
    depends_on:
      - backend-api
    ports:
      - "8083:80"

  # ===================== 定时备份 =====================
  mysql-backup:
    image: mysql:8.0
    container_name: auto710-backup
    restart: always
    depends_on:
      mysql8:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql8
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root@auto710}
      MYSQL_DATABASE: auto_repair
      BACKUP_KEEP: "7"
    volumes:
      - ./deploy/backup:/backup:ro
      - backup-data:/backup-data
    entrypoint: ["/backup/backup.sh"]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  backend-data:
  backend-logs:
  backup-data:
