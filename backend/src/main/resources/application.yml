server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: auto710-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  messages:
    basename: i18n/messages
    encoding: UTF-8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/auto_repair?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: auto_repair_app
    password: auto710@2026
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: Auto710HikariPool
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 3000ms
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: auto710
    password: auto710@2026
    virtual-host: auto_repair
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.auto710.entity
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true

# ===== 业务自定义配置 =====
auto710:
  # JWT 配置
  jwt:
    secret: 710auto-secret-key-please-change-in-production-0123456789
    expire-minutes: 720          # 后台令牌有效期(分钟)
    member-expire-minutes: 43200 # 会员令牌有效期(分钟) 30天
  # 微信配置（后台可覆盖，见 sys_config）
  wechat:
    enabled: false
    mp-app-id: ""
    mp-app-secret: ""
    ma-app-id: ""
    ma-app-secret: ""
  # 安全
  security:
    aes-key: 710autoAesKey1234567890abcdef  # 32 位，用于手机号/车牌/VIN 加密
    white-list:
      - /api/auth/login
      - /api/auth/captcha
      - /api/member/login
      - /api/member/wx-login
      - /api/tech/login
      - /api/public/**
      - /api/www/**
      - /api/h5/**
      - /api/miniapp/**
      - /api/track/**
      - /doc.html
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /error
      - /upload/local/**
  # 对象存储默认驱动（后台可切换）
  storage:
    driver: local
    local:
      base-path: ./data/upload
      url-prefix: http://127.0.0.1:8080/upload/local

logging:
  level:
    root: info
    com.auto710: debug
    org.springframework.web: info
  file:
    name: ./logs/auto710-backend.log
